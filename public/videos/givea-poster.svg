<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#dbeafe" />
      <stop offset="70%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBalloon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background: Village / Brick site outdoor sky -->
  <rect width="720" height="1280" fill="url(#skyGrad)" />

  <!-- Distant brick kiln wall / stacks -->
  <g opacity="0.85">
    <rect x="0" y="420" width="720" height="280" fill="#c2410c" />
    <!-- Brick pattern lines -->
    <path d="M0,460 H720 M0,500 H720 M0,540 H720 M0,580 H720 M0,620 H720 M0,660 H720" stroke="#7c2d12" stroke-width="3" opacity="0.4" />
  </g>

  <!-- Ground sandy area -->
  <rect x="0" y="700" width="720" height="580" fill="url(#groundGrad)" />

  <!-- Givea Food Donation Placard -->
  <g transform="translate(60, 480)" filter="url(#cardShadow)">
    <!-- White placard card -->
    <rect width="600" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />

    <!-- Givea Logo Top-Right -->
    <g transform="translate(450, 24)">
      <!-- Givea logo petals -->
      <circle cx="20" cy="18" r="9" fill="#f97316" />
      <circle cx="34" cy="18" r="9" fill="#ec4899" />
      <circle cx="27" cy="8" r="9" fill="#8b5cf6" />
      <text x="50" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#4338ca">Givea</text>
    </g>

    <!-- Main Text: Happy birthday Vikas Anna -->
    <text x="40" y="140" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#0f172a">Happy birthday</text>
    <text x="40" y="190" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#0f172a">Vikas Anna</text>

    <!-- Purple Balloons at bottom left -->
    <g transform="translate(45, 270)">
      <!-- Balloon strings -->
      <path d="M22,50 Q28,85 40,110" stroke="#64748b" stroke-width="2" fill="none" />
      <path d="M48,50 Q42,80 40,110" stroke="#64748b" stroke-width="2" fill="none" />
      <!-- Balloon 1 -->
      <ellipse cx="22" cy="35" rx="18" ry="24" fill="url(#purpleBalloon)" />
      <polygon points="19,57 25,57 22,62" fill="#7e22ce" />
      <ellipse cx="16" cy="26" rx="4" ry="7" fill="#ffffff" opacity="0.5" />
      <!-- Balloon 2 -->
      <ellipse cx="48" cy="30" rx="19" ry="25" fill="url(#purpleBalloon)" />
      <polygon points="45,53 51,53 48,58" fill="#7e22ce" />
      <ellipse cx="42" cy="22" rx="4" ry="7" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Polaroid Photo of Vikas Anna -->
    <g transform="translate(360, 95)">
      <!-- Photo frame -->
      <rect width="190" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
      <!-- Inner photo rect -->
      <rect x="10" y="10" width="170" height="150" rx="4" fill="#1e293b" />
      <!-- Stylized silhouette portrait of Vikas Anna in cap & jacket -->
      <!-- Cap turned backwards -->
      <path d="M65,55 Q95,35 125,55 Q135,68 95,70 Q55,68 65,55 Z" fill="#0f172a" />
      <path d="M50,60 Q95,50 140,60 Q145,65 95,68 Q45,65 50,60 Z" fill="#334155" />
      <!-- Face -->
      <ellipse cx="95" cy="80" rx="26" ry="28" fill="#e2a77a" />
      <!-- Hair / sideburns -->
      <path d="M68,70 Q70,95 72,100" stroke="#0f172a" stroke-width="4" fill="none" />
      <path d="M122,70 Q120,95 118,100" stroke="#0f172a" stroke-width="4" fill="none" />
      <!-- Eyes & Smile -->
      <circle cx="85" cy="78" r="3" fill="#0f172a" />
      <circle cx="105" cy="78" r="3" fill="#0f172a" />
      <path d="M85,92 Q95,102 105,92" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Black jacket / hoodie shoulders -->
      <path d="M40,160 C50,118 75,110 95,110 C115,110 140,118 150,160 Z" fill="#0f172a" />
      <!-- Small round white pin badge on jacket -->
      <circle cx="120" cy="135" r="5" fill="#ffffff" />
      <circle cx="120" cy="135" r="2" fill="#ef4444" />
      <!-- Yellow stars in photo background -->
      <text x="20" y="32" font-size="12" fill="#fbbf24">✦</text>
      <text x="155" y="42" font-size="14" fill="#fbbf24">★</text>
    </g>

    <!-- Golden quote mark -->
    <g transform="translate(435, 310)">
      <text x="0" y="25" font-family="Georgia, serif" font-weight="900" font-size="38" fill="#eab308">“ ”</text>
    </g>

    <!-- URL footer -->
    <text x="300" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#475569" letter-spacing="1">www.givea.in</text>
  </g>

  <!-- Top Title Badge -->
  <g transform="translate(360, 100)" text-anchor="middle">
    <rect x="-240" y="0" width="480" height="60" rx="30" fill="rgba(255, 255, 255, 0.95)" stroke="#f472b6" stroke-width="3" />
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#db2777">A Little Birthday Wish For You 🎂❤️</text>
  </g>

  <!-- Subtitle note at bottom -->
  <g transform="translate(360, 1000)" text-anchor="middle">
    <rect x="-280" y="0" width="560" height="70" rx="20" fill="rgba(255, 255, 255, 0.9)" stroke="#fbbf24" stroke-width="3" />
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" fill="#92400e">“Happy birthday Vikas Anna!”</text>
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#b45309">Warm wishes recorded during birthday meal donation • Givea.in</text>
  </g>
</svg>
